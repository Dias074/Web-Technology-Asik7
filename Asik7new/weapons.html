<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weapons & Effects — CS2 Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header small">
    <a class="brand-link" href="index.html">← Back</a>
    <h1>Weapons — Effects Demo</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Visibility Methods (Task 2)</h2>
      <p id="vis-par">Этот параграф будет скрываться и показываться кнопками ниже.</p>
      <div class="controls">
        <button id="btn-hide" class="btn">Hide</button>
        <button id="btn-show" class="btn">Show</button>
        <button id="btn-toggle" class="btn">Toggle</button>
      </div>
    </section>

    <section class="card">
      <h2>Fade Methods (Task 3)</h2>
      <img id="fade-img" src="images/авп.jpg" alt="weapon" class="img-demo">
      <div class="controls">
        <button id="fade-in" class="btn">Fade In</button>
        <button id="fade-out" class="btn">Fade Out</button>
        <button id="fade-toggle" class="btn">Fade Toggle</button>
      </div>
    </section>

    <section class="card">
      <h2>Slide Methods (Task 4)</h2>
      <button id="panel-toggle" class="btn">Toggle Panel</button>
      <div id="panel" class="panel">
        <p>Коллапсируемая панель. Использует .slideToggle(), .slideUp(), .slideDown().</p>
      </div>
    </section>

    <footer class="site-footer">
      <a href="index.html" class="muted">Return to Home</a>
    </footer>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
