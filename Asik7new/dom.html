<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DOM Manipulation — CS2 Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header small">
    <a class="brand-link" href="index.html">← Back</a>
    <h1>DOM Manipulation</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add / Remove Items (Task 5)</h2>
      <ul id="item-list">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
      <input id="new-item-text" placeholder="New item text" />
      <div class="controls">
        <button id="add-item" class="btn">Add Item (append)</button>
        <button id="prepend-item" class="btn">Prepend Item</button>
        <button id="remove-last" class="btn">Remove Last</button>
      </div>
    </section>

    <section class="card">
      <h2>Modify Attributes (Task 6)</h2>
      <img id="attr-img" src="images/командаос2.png" alt="attr image" class="img-demo">
      <div class="controls">
        <button id="change-src" class="btn">Change Image src</button>
        <button id="change-href" class="btn">Change Link href</button>
      </div>
      <p><a id="dynamic-link" href="https://teamspirit.gg/team/cs2" target="_blank">Example link</a></p>
    </section>

    <section class="card">
      <h2>Form Interaction (Task 7)</h2>
      <form id="demo-form" action="#" onsubmit="return false;">
        <label>Name: <input type="text" id="name-input" /></label>
        <label>Email: <input type="email" id="email-input" /></label>
      </form>
      <div id="live-preview" class="panel">
        <p>Name: <span id="live-name"></span></p>
        <p>Email: <span id="live-email"></span></p>
      </div>
    </section>

    <footer class="site-footer">
      <a href="index.html" class="muted">Return to Home</a>
    </footer>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
