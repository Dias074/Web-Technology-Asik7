<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery / Mini Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header small">
    <a class="brand-link" href="index.html">← Back</a>
    <h1>Gallery / Accordion</h1>
  </header>

  <main class="container">
    <section class="card">
      <h2>Image Gallery (mini project)</h2>
      <div class="gallery-grid">
        <img class="gallery-item" src="images/donk.jpg" alt="g1">
        <img class="gallery-item" src="images/spirit.webp" alt="g2">
        <img class="gallery-item" src="images/перчатки2.jpg" alt="g3">
        <img class="gallery-item" src="images/нож.jpg" alt="g4">
      </div>
      <div id="imgModal" class="modal" aria-hidden="true">
        <div class="modal-content">
          <button class="modal-close" id="modalClose">×</button>
          <img id="modalImg" src="" alt="preview">
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Accordion Menu (mini project)</h2>
      <div class="accordion">
        <div class="acc-item">
          <h4 class="acc-header">Section 1</h4>
          <div class="acc-body"><p>Content for section 1. Slide animations used.</p></div>
        </div>
        <div class="acc-item">
          <h4 class="acc-header">Section 2</h4>
          <div class="acc-body"><p>Content for section 2. Slide animations used.</p></div>
        </div>
        <div class="acc-item">
          <h4 class="acc-header">Section 3</h4>
          <div class="acc-body"><p>Content for section 3. Slide animations used.</p></div>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <a href="index.html" class="muted">Return to Home</a>
    </footer>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
